name: Validate experimental results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate experiment records
        run: python maintenance/validate.py site
      - name: Check result documents
        run: python maintenance/build_readme.py --check
